# The daemon needs more than the default 2 GB for one thing: packaging the
# release bundle. The bundle is 153 MB, with 189 MB of models in the asset
# pack, and the bundletool that packages it holds all of that in memory at
# once. With 2 GB, `packageReleaseBundle` fails with "Java heap space" on a
# clean build. It goes through on an incremental build only because less
# other work is in the daemon at the same time, which is exactly the kind of
# failure that shows up on someone else's machine and not on yours.
#
# 4 GB is enough for the bundle with room to spare, and is small enough to be
# unremarkable on any machine that can build this.
org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

android.useAndroidX=true
android.nonTransitiveRClass=true

# The Android Gradle Plugin checks the compileSdk against the SDK versions it
# was tested with, and warns when it is newer. compileSdk 36 is required by
# Google Play from 31 August 2026, and the plugin in use here was released
# before that SDK was final, so the warning is expected rather than a sign of
# a problem. It is suppressed so the build output stays readable.
android.suppressUnsupportedCompileSdk=36

kotlin.code.style=official
